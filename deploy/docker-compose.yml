name: tallyard

# Full local stack: PostgreSQL, Kafka (KRaft), one API node, one worker node, Prometheus, Grafana,
# Jaeger. Start with `docker compose up -d --build` from the repository root (see Makefile / README).
# Scale workers to observe partition rebalancing: `docker compose up -d --scale worker=2`.

x-app-env: &app-env
  TALLYARD_DB_URL: jdbc:postgresql://postgres:5432/tallyard
  TALLYARD_DB_USER: tallyard
  TALLYARD_DB_PASSWORD: ${TALLYARD_DB_PASSWORD:-tallyard}
  TALLYARD_KAFKA_BOOTSTRAP: kafka:9092
  TALLYARD_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  TALLYARD_TRACE_SAMPLING: ${TALLYARD_TRACE_SAMPLING:-0.2}
  TALLYARD_LOG_FORMAT: ${TALLYARD_LOG_FORMAT:-}
  TALLYARD_BOOTSTRAP_TOKEN: ${TALLYARD_BOOTSTRAP_TOKEN:-}
  TALLYARD_ENCRYPTION_KEY: ${TALLYARD_ENCRYPTION_KEY:?set TALLYARD_ENCRYPTION_KEY in .env (see .env.example)}
  TALLYARD_DEMO_ENABLED: ${TALLYARD_DEMO_ENABLED:-true}
  TALLYARD_DEMO_ADMIN_KEY: ${TALLYARD_DEMO_ADMIN_KEY:-}
  TALLYARD_DEMO_PERIOD_MINUTES: ${TALLYARD_DEMO_PERIOD_MINUTES:-10}
  TALLYARD_DEMO_GRACE_SECONDS: ${TALLYARD_DEMO_GRACE_SECONDS:-30}
  TALLYARD_DEMO_WEBHOOK_URL: http://api:8080/v1/webhook-sink
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseZGC
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 20s

x-app-runtime: &app-runtime
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: 1g

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tallyard
      POSTGRES_USER: tallyard
      POSTGRES_PASSWORD: ${TALLYARD_DB_PASSWORD:-tallyard}
    command: >-
      postgres -c shared_buffers=256MB -c max_connections=120 -c synchronous_commit=on
               -c log_min_duration_statement=500ms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallyard -d tallyard"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports:
      - "9094:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    <<: *app-runtime
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tallyard/app:local
    environment:
      <<: *app-env
      TALLYARD_ROLE: api
    ports:
      - "8080:8080"
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  worker:
    <<: *app-runtime
    image: tallyard/app:local
    environment:
      <<: *app-env
      TALLYARD_ROLE: worker
      TALLYARD_DEMO_ENABLED: "false"
      TALLYARD_PORT: 8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP HTTP

volumes:
  pgdata:
  kafkadata:
